<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>compare similar diff</title>

    <script src= "https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>

    <style>

        img{
            padding : 10px;
        }

    </style>

<script>

    let resultlist
    let code
    let photodict = {}

    $(function(){

        console.log("start")
        readJson()
    })


    function getUrlParameter(sParam) {

        console.log("geturl",sParam)
        var sPageURL = window.location.search.substring(1);
        var sURLVariables = sPageURL.split('&');

        for (var i = 0; i < sURLVariables.length; i++) {
            var sParameterName = sURLVariables[i].split('=');

            var key = sParameterName[0];

            if (key == sParam) {
            return sParameterName[1];
            }
        }
    }


    function readJson(){


        code = getUrlParameter("code")

        $.getJSON( `fovresult-${code}.json`, data => {

            console.log(data)

            handleSelectionList(data)
 

        });

    }


    function handleSelectionList(data){


        const photolist = data.spotlist

        const comparelist = data.comparelist

        const anglelist = [0,90,180,270]



        let selectionlist = `<select>`


        photolist.forEach(photo => {

            anglelist.forEach(angle=>{


                const photofullname = `${photo}-${angle}.jpg`
                const photofullpath = `photo_${code}_output/${photofullname}`

                // console.log(photofullpath)

                const filter = comparelist.filter(e=>{

                    return e.fromfilePath == photofullpath
                } )


                photodict[photofullname] = filter

                //console.log(filter)

                str = `${photofullname} ${filter.length}`

                selectionlist += `<option value = '${photofullname}'>${str}\n`

            })

            
        });

        selectionlist +='</select>'

        console.log(selectionlist)


        $("#selectbar").html(selectionlist)


        $("#selectbar").change(e=>{

            console.log(e.target.value)

            changePhoto(e.target.value)
        })

        console.log(photodict)








    }


    function changePhoto(photoname){

        console.log(photoname)


        


    }



</script>




</head>





<body>


    <div id="selectbar"></div>

    <div id="fromphoto"></div>


    <div id="tophoto"></div>


    
</body>
</html>
